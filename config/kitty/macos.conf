map cmd+j kitten pass_keys.py neighboring_window bottom alt+j
map cmd+k kitten pass_keys.py neighboring_window top    alt+k
map cmd+h kitten pass_keys.py neighboring_window left   alt+h
map cmd+l kitten pass_keys.py neighboring_window right  alt+l
map cmd+w launch --cwd=current
map cmd+enter launch 
map cmd+q close_window
macos_quit_when_last_window_closed yes

background_blur 64

map alt+v launch --stdin-source=@screen_scrollback --type=overlay nvim --cmd "set eventignore=FileType" +"nnoremap q ZQ" +"call nvim_open_term(0, {})" +"set nomodified nolist" +"$" -
